name: Build CM11

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo docker image prune -a -f

      - name: Build ROM in Docker
        run: |
          docker run -i ubuntu:14.04 /bin/bash << 'EOF'
          export DEBIAN_FRONTEND=noninteractive
          
          sed -i -e 's/archive.ubuntu.com/old-releases.ubuntu.com/g' /etc/apt/sources.list
          sed -i -e 's/security.ubuntu.com/old-releases.ubuntu.com/g' /etc/apt/sources.list
          
          apt-get update
          apt-get install -y git-core gnupg flex bison gperf build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev ccache libgl1-mesa-dev libxml2-utils xsltproc unzip python openjdk-7-jdk schedtool
          
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          export PATH=~/bin:$PATH
          
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          mkdir -p /workspace/android/cm11
          cd /workspace/android/cm11
          
          repo init -u https://github.com/CyanogenMod/android.git -b cm-11.0 --depth=1
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags
          
          source build/envsetup.sh
          breakfast fx3
          make -j4 bacon
          EOF
