name: Build CM11

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    
    container:
      image: ubuntu:14.04

    steps:
      - name: Prepare Legacy Environment & Build
        run: |
          export DEBIAN_FRONTEND=noninteractive
          
          # Repositórios antigos do Ubuntu 14.04
          sed -i -e 's/archive.ubuntu.com/old-releases.ubuntu.com/g' /etc/apt/sources.list
          sed -i -e 's/security.ubuntu.com/old-releases.ubuntu.com/g' /etc/apt/sources.list
          
          apt-get update && apt-get install -y \
            git-core gnupg flex bison gperf build-essential \
            zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev ccache \
            libgl1-mesa-dev libxml2-utils xsltproc unzip python openjdk-7-jdk \
            schedtool

          # Tooling
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          export PATH=~/bin:$PATH

          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          # Sync e Build
          mkdir -p android/cm11
          cd android/cm11

          repo init -u https://github.com/CyanogenMod/android.git -b cm-11.0 --depth=1
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags

          source build/envsetup.sh
          breakfast fx3
          make -j$(nproc) bacon
